<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gagal Masuk ke Akun</title>
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <div class="error-card">
        <!-- Icon Peringatan -->
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
        </div>

        <!-- Badge Error -->
        <div class="error-badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.007v.008H12v-.008zM12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25z" />
            </svg>
            Otentikasi Ditolak • Kode: AUTH_ERR_401
        </div>

        <h1>Gagal Masuk ke Akun</h1>
        <p class="subtitle">Kombinasi email atau kata sandi yang Anda masukkan tidak cocok dengan catatan kami.</p>

        <!-- Kotak Batas Percobaan -->
        <div class="attempts-box">
            <div class="attempts-header">
                <span class="attempts-title">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v3a3 3 0 00-3 3v6.75a3 3 0 003 3h10.5a3 3 0 003-3v-6.75a3 3 0 00-3-3v-3c0-2.9-2.35-5.25-5.25-5.25zm3 8.25v-3a3 3 0 10-6 0v3h6z" clip-rule="evenodd" />
                    </svg>
                    Batas Percobaan Login
                </span>
                <span class="attempts-badge">{{ATTEMPTS_REMAINING_BADGE}}</span>
            </div>
            
            <div class="progress-track">
                <div class="progress-fill" style=></div>
            </div>
            
            <div class="attempts-footer-text">
                *{{WARNING_POLICY_TEXT}}
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="btn-group">
            <a href="{{BTN_PRIMARY_LINK}}" class="btn btn-danger">Coba Login Lagi</a>
            <a href="{{BTN_SECONDARY_LINK}}" class="btn btn-dark">Lupa Password?</a>
        </div>
    </div>

</body>
</html>
